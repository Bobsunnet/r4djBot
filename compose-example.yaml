services:

  postgres:
    image: postgres:14.20-bookworm
    container_name: pg-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg-bot-data:/var/lib/postgresql/data
    networks:
      - dbnet

  tgbot:
    build: .
    image: tgbot:1.6.1
    container_name: bot
    expose:
      - "8000"
    logging:
      driver: "journald"
      options:
        tag: "{{.Name}}"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - dbnet
      - web
    depends_on:
      - postgres

networks:
  dbnet:
    driver: bridge
  web:
    external: true

volumes:
  pg-bot-data:
